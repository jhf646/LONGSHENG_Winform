  </div>
  <nav class="sidebar-nav">

  </nav>
  <div class="sidebar-footer">

      <div class="user-avatar" id="sidebarAvatar">U</div>
      <div><div class="user-name" id="sidebarUserName">未登录</div><div class="user-role" id="sidebarUserRole">-</div></div>
    </div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>
</div>

<!-- 主内容 -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">仪表盘</div>
    <div class="topbar-right">
      <span class="topbar-clock" id="topbarClock"></span>
      <span class="topbar-divider">|</span>
      <span class="topbar-status" id="headerStatus">加载中...</span>
      <img src="logo.jpg" alt="氢晨" class="topbar-logo">
    </div>
  </div>
  <div class="content">

    <div class="metrics" id="metricsContainer">
      <div class="metric-card"><div class="metric-icon" style="background:#e8f0fe;font-size:20px">📥</div><div><div class="metric-value" id="metricTodayIn">0</div><div class="metric-label">今日入库</div></div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#fef3e8;font-size:20px">📤</div><div><div class="metric-value" id="metricTodayOut">0</div><div class="metric-label">今日出库</div></div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#fde8e8;font-size:20px">🔴</div><div><div class="metric-value" id="metricOccupied">0</div><div class="metric-label">占用库位</div></div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#e8f8f0;font-size:20px">🟢</div><div><div class="metric-value" id="metricFree">0</div><div class="metric-label">空闲库位</div></div></div>
      <div class="metric-card"><div class="metric-icon" style="background:#fef3e8;font-size:20px">⚠️</div><div><div class="metric-value" id="metricAlert">正常</div><div class="metric-label">库存预警</div></div></div>
    </div>

    <div class="card"><div class="card-header">🗄️ 库位可视化</div>
      <div class="card-body"><div class="legend"><div class="legend-item"><div class="legend-swatch" style="background:#eafaf1"></div>空闲</div><div class="legend-item"><div class="legend-swatch" style="background:#fde8e8"></div>占用</div></div><div class="slot-visual" id="dashboardSlots"></div></div>
    </div>

    <div class="card"><div class="card-header">📡 设备运行状态</div>
      <div class="card-body" id="deviceStatusBody" style="font-size:13px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
          <div style="display:flex;align-items:center;gap:8px;padding:10px;background:#f8f9fc;border-radius:6px">
            <span style="font-size:18px">🔌</span>
            <div><div style="font-size:11px;color:#98a2b3">连接状态</div>
            <div style="font-weight:bold" id="devConnStatus">加载中...</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:10px;background:#f8f9fc;border-radius:6px">
            <span style="font-size:18px">⚙️</span>
            <div><div style="font-size:11px;color:#98a2b3">运行状态</div>
            <div style="font-weight:bold" id="devRunStatus">加载中...</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:10px;background:#f8f9fc;border-radius:6px">
            <span style="font-size:18px">📋</span>
            <div><div style="font-size:11px;color:#98a2b3">任务状态</div>
            <div style="font-weight:bold;color:#667085" id="devTaskStatus">加载中...</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:10px;background:#f8f9fc;border-radius:6px">
            <span style="font-size:18px">⚠️</span>
            <div><div style="font-size:11px;color:#98a2b3">故障代码</div>
            <div style="font-weight:bold" id="devFaultStatus">加载中...</div></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
initPage('dashboard', '仪表盘');
loadDashboard();
onPageActivate(loadDashboard);

// ===== 仪表盘逻辑 =====
async function loadDashboard() {
    try {
        const data = await api('/appstate/dashboard');
        document.getElementById('metricTodayIn').textContent = data.todayInbound;
        document.getElementById('metricTodayOut').textContent = data.todayOutbound;
        document.getElementById('metricOccupied').textContent = data.occupiedSlots;
        document.getElementById('metricFree').textContent = data.freeSlots;
        const alertEl = document.getElementById('metricAlert');
        alertEl.textContent = data.alertStatus;
        alertEl.style.color = data.isAlert ? '#d92d20' : '#1d2939';
        document.getElementById('headerStatus').textContent = `📥${data.todayInbound}入 · 📤${data.todayOutbound}出 · 🟠${data.occupiedSlots}占用 · 🟢${data.freeSlots}空闲 · ${data.isAlert ? '⚠️' : '✅'}${data.alertStatus}`;
        renderSlotVisual('dashboardSlots', data.slots);
        loadDeviceStatus();
    } catch (e) { toast('加载失败: ' + e.message, 'error'); }
}

async function loadDeviceStatus() {
    try {
        const resp = await fetch(API_BASE + '/device/monitor', {
            headers: authToken ? { 'Authorization': 'Bearer ' + authToken } : {}
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        const state = data.status?.state ?? 0;
        const stateMap = { 1: '空闲中', 2: '运行中', 3: '故障中', 4: '暂停中' };
        const stateIcon = { 1: '🟢', 2: '🔵', 3: '🔴', 4: '🟠' };
        const stateColor = { 1: '#079455', 2: '#175cd3', 3: '#d92d20', 4: '#dc6803' };

        // 只更新 textContent 和 style，不使用 innerHTML
        const connEl = document.getElementById('devConnStatus');
        if (connEl) {
            connEl.textContent = data.connected ? '✅ 已连接' : '❌ 未连接';
            connEl.style.color = data.connected ? '#079455' : '#d92d20';
        }
        const runEl = document.getElementById('devRunStatus');
        if (runEl) {
            runEl.textContent = (stateIcon[state] || '🟠') + ' ' + (stateMap[state] || '未知');
            runEl.style.color = stateColor[state] || '#dc6803';
        }
        const taskEl = document.getElementById('devTaskStatus');
        if (taskEl) {
            taskEl.textContent = typeof data.flags?.taskDone === 'undefined' ? '❓ 未知' : data.flags?.taskDone === 1 ? '✅ 已完成' : '⏳ 等待中';
            taskEl.style.color = '#667085';
        }
        const faultEl = document.getElementById('devFaultStatus');
        if (faultEl) {
            const hasFault = data.faults && data.faults.length > 0;
            faultEl.textContent = hasFault ? '🔴 ' + data.faults.length + ' 个故障' : '🟢 无故障';
            faultEl.style.color = hasFault ? '#d92d20' : '#079455';
        }
    } catch (e) { /* 静默 */ }
}

function renderFaultCodes(faults, errorCodeHigh, errorCodeLow) {
    const rawHex = '4010=' + (errorCodeHigh ?? 0).toString(16).toUpperCase().padStart(4,'0')
        + ' 4011=' + (errorCodeLow ?? 0).toString(16).toUpperCase().padStart(4,'0');
    const regHigh = (errorCodeHigh ?? 0);
    const regLow = (errorCodeLow ?? 0);
    const binHigh = regHigh.toString(2).padStart(16, '0').replace(/(.{4})/g, '$1 ');
    const binLow = regLow.toString(2).padStart(16, '0').replace(/(.{4})/g, '$1 ');
    if (!faults || faults.length === 0) {
        return `<span style="color:#079455">🟢 无故障</span>
            <div style="font-size:11px;color:#98a2b3;margin-top:2px">${rawHex} | ${binHigh} ${binLow}</div>`;
    }
    const faultItems = faults.map(f =>
        `<div style="display:flex;align-items:center;gap:6px;padding:3px 0">
            <span style="color:#d92d20;font-size:12px">🔴</span>
            <span style="font-size:12px;color:#1d2939">故障${f.code}: ${f.name}</span>
        </div>`
    ).join('');
    return `<div style="color:#d92d20;font-weight:bold;margin-bottom:4px">🔴 ${faults.length} 个故障</div>
        <div style="font-size:11px;color:#98a2b3;margin-bottom:4px">${rawHex} | ${binHigh} ${binLow}</div>
        ${faultItems}`;
}

function renderSlotVisual(containerId, slots) {
    const container = document.getElementById(containerId);
    if (!container || !slots) return;
    container.innerHTML = '';
    for (let row = 1; row <= 2; row++) {
        const rack = document.createElement('div'); rack.className = 'slot-rack';
        const hdr = document.createElement('h4'); hdr.textContent = `第 ${row} 排`; rack.appendChild(hdr);
        const grid = document.createElement('div'); grid.className = 'rack-grid';
        const c = document.createElement('div'); c.className = 'header-cell'; c.textContent = '层/列'; grid.appendChild(c);
        for (let c2 = 4; c2 >= 1; c2--) { const hc = document.createElement('div'); hc.className = 'header-cell'; hc.textContent = `${c2}列`; grid.appendChild(hc); }
        for (let lv = 8; lv >= 1; lv--) {
            const lh = document.createElement('div'); lh.className = 'header-cell'; lh.textContent = `${lv}层`; grid.appendChild(lh);
            for (let col = 4; col >= 1; col--) {
                const slot = slots.find(s => s.rowNumber === row && s.columnNumber === col && s.levelNumber === lv);
                const cell = document.createElement('div');
                cell.className = `cell ${slot?.isEnabled === false ? 'disabled' : (slot?.isOccupied ? 'occupied' : 'free')}`;
                if (slot) {
                    const isEntrance = slot.rowNumber === 1 && slot.columnNumber === 1 && slot.levelNumber === 1;
                    const isDisabled = slot.isEnabled === false;
                    cell.innerHTML = isEntrance
                        ? `<div class="slot-status" style="font-size:9px;color:#667085">🚪总出入口</div>`
                        : isDisabled
                        ? `<div class="slot-status" style="font-size:9px;color:#999">⚪禁用</div>`
                        : `<div class="slot-status">${slot.isOccupied ? '🔴占用' : '🟢空闲'} ${String(slot.internalNumber).padStart(3, '0')}</div>`;
                    cell.title = `${slot.slotCode} (内部编号: ${String(slot.internalNumber).padStart(3, '0')})${isDisabled ? ' [已禁用]' : ''}`;
                }
                grid.appendChild(cell);
            }
        }
        rack.appendChild(grid); container.appendChild(rack);
    }
}
</script>

</body>
</html>
