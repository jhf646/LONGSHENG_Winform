<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氢晨库存管理系统 - 报表统计</title>
<link rel="stylesheet" href="css/style.css"><script src="js/shared.js"></script>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><div class="logo-icon" style="background:transparent;width:auto;height:auto;font-size:22px">🏭</div><div class="logo-text">氢晨科技<small>库存管理系统</small></div></div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="index.html"><span class="nav-icon">📊</span>仪表盘</a>
    <a class="nav-item perm-write" href="inbound.html"><span class="nav-icon">📥</span>入库管理</a>
    <a class="nav-item perm-write" href="outbound.html"><span class="nav-icon">📤</span>出库管理</a>
    <a class="nav-item" href="slots.html"><span class="nav-icon">🗄️</span>货位管理</a>
    <a class="nav-item" href="ledger.html"><span class="nav-icon">📋</span>台账查询</a>
    <a class="nav-item active" href="report.html"><span class="nav-icon">📈</span>报表统计</a>
    <a class="nav-item perm-write" href="alert.html"><span class="nav-icon">⚠️</span>库存预警</a>
    <a class="nav-item" href="devmonitor.html"><span class="nav-icon">📡</span>设备监控</a>
    <a class="nav-item perm-write" href="devcontrol.html"><span class="nav-icon">🎮</span>设备调用</a>
    <a class="nav-item perm-admin" href="users.html"><span class="nav-icon">👥</span>用户管理</a>
    <a class="nav-item perm-admin" href="roles.html"><span class="nav-icon">🔐</span>角色权限</a>
  </nav>
  <div class="sidebar-footer"><div class="user-info"><div class="user-avatar" id="sidebarAvatar">U</div><div><div class="user-name" id="sidebarUserName">-</div><div class="user-role" id="sidebarUserRole">-</div></div></div><button class="logout-btn" onclick="logout()">退出登录</button></div>
</div>
<div class="main">
  <div class="topbar"><div class="topbar-title" id="pageTitle">报表统计</div><div class="topbar-right"><span class="topbar-clock" id="topbarClock"></span><span class="topbar-divider">|</span><span class="topbar-status" id="headerStatus">-</span><img src="logo.jpg" alt="氢晨" class="topbar-logo"></div></div>
  <div class="content">
    <div class="card"><div class="card-header">📈 报表导出</div>
      <div class="card-body">
        <div class="form-grid"><div class="form-group"><label>报表类型</label><select id="reportType"><option>进出台账</option><option>库存清单</option><option>操作记录</option></select></div><div class="form-group"></div></div>
        <div class="btn-group"><button class="btn btn-primary" onclick="exportCSV()">📥 导出CSV</button><button class="btn" onclick="previewReport()">👁️ 预览</button></div>
      </div>
    </div>
    <div class="card"><div class="card-header">📄 报表预览</div>
      <div class="card-body"><pre id="reportPreview" style="background:#f9fafb;padding:12px;border-radius:6px;font-size:12px;max-height:400px;overflow:auto;font-family:Consolas,monospace;white-space:pre-wrap;border:1px solid var(--border)"></pre></div>
    </div>
  </div>
</div>
<script>
initPage('report', '报表统计');
async function previewReport() { try { const d = await api('/ledgerentries/report', { method:'POST', body:JSON.stringify({reportType:document.getElementById('reportType').value}) }); document.getElementById('reportPreview').textContent = (d.csvLines||[]).join('\n'); } catch(e) { toast('生成失败', 'error'); } }
async function exportCSV() { try { const d = await api('/ledgerentries/report', { method:'POST', body:JSON.stringify({reportType:document.getElementById('reportType').value}) }); const blob = new Blob(['\uFEFF' + (d.csvLines||[]).join('\n')], {type:'text/csv;charset=utf-8;'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = document.getElementById('reportType').value + '-' + new Date().toISOString().slice(0,10) + '.csv'; a.click(); toast('✅ 导出成功', 'success'); } catch(e) { toast('❌ 导出失败', 'error'); } }
</script>
</body>
</html>
